  /gene_lists:
    x-swagger-router-controller: mongo
    get:
      summary: "Fetch saved lists"
      description: "Fetchs saved lists for a validated user or public lists"
      tags:
        - "User Data"
      operationId: genelists
      parameters:
        - in: query
          name: isPublic
          description: Return public gene lists
          type: boolean
          required: true
        - in: query
          name: site
          description: site identifier
          type: string
          required: true
        -
          name: "rows"
          in: "query"
          description: "number of lists to return (default: 20)"
          required: false
          type: "integer"
        - in: query
          name: includeDeleted
          description: "which lists to return: 'active' (default) or 'trash' (owner's soft-deleted lists)"
          required: false
          type: string
          enum:
            - active
            - trash
      responses:
        200:
          description: Metadata for all personal or public gene lists
        401:
          description: Authorization failed
    post:
      summary: "Save a validated list of IDs"
      description: "Accepts list metadata and upserts to mongo"
      tags:
        - "User Data"
      operationId: saveList
      consumes:
        - application/json
      parameters:
        - in: body
          name: list
          description: "list metadata plus the resolved gene ids. The server derives n_genes and computes the hash."
          required: true
          schema:
            type: object
            required:
              - label
              - site
              - ids
            properties:
              label:
                type: string
                maxLength: 255
              site:
                type: string
                maxLength: 64
              isPublic:
                type: boolean
              ids:
                type: array
                maxItems: 6000
                items:
                  type: string
                  maxLength: 255
      responses:
        200:
          description: "List saved; returns the server-computed hash"
        400:
          description: "Invalid body (missing label/site/ids, too many ids, or a client-supplied hash)"
        401:
          description: Authorization failed
    delete:
      summary: "Delete a saved gene list"
      description: "Deletes a gene list owned by the authenticated user"
      tags:
        - "User Data"
      operationId: deleteList
      parameters:
        - in: query
          name: listId
          description: id of the gene list to delete
          type: string
          required: true
        - in: query
          name: force
          description: "if true, permanently delete now instead of the 30-day soft delete"
          type: boolean
          required: false
      responses:
        200:
          description: List deleted (soft by default; permanent if force=true)
        401:
          description: Authorization failed
        404:
          description: List not found or not owned by user
    patch:
      summary: "Update a saved gene list"
      description: "Updates label and/or isPublic on a gene list owned by the authenticated user"
      tags:
        - "User Data"
      operationId: updateList
      consumes:
        - application/json
      parameters:
        - in: query
          name: listId
          description: id of the gene list to update
          type: string
          required: true
        - in: body
          name: updates
          description: fields to update
          required: true
          schema:
            type: object
            properties:
              label:
                type: string
              isPublic:
                type: boolean
      responses:
        200:
          description: List updated
        400:
          description: No valid fields to update
        401:
          description: Authorization failed
        404:
          description: List not found or not owned by user
  /gene_lists/restore:
    x-swagger-router-controller: mongo
    post:
      summary: "Restore a soft-deleted gene list"
      description: "Un-marks a soft-deleted gene list (clears deletedAt) for its owner, within the 30-day window"
      tags:
        - "User Data"
      operationId: restoreList
      parameters:
        - in: query
          name: listId
          description: id of the gene list to restore
          type: string
          required: true
      responses:
        200:
          description: List restored
        401:
          description: Authorization failed
        404:
          description: No deleted list to restore (already purged or not owned)
  /gene_lists/validate:
    x-swagger-router-controller: solr
    post:
      summary: "Validate a list of IDs"
      description: "Accepts a list of IDs and returns validation results"
      tags:
