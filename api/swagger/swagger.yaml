swagger: "2.0"
info:
  version: "0.59.0"
  title: API for sorghumbase release 11
# basePath prefixes all resource paths
basePath: /sorghum_v11
# public host clients build request URLs against (TLS terminated by apache,
# proxied to the swagger server on squam:50011). For local-only testing,
# override with host: localhost:50011 and add http to schemes below.
host: data.sorghumbase.org
schemes:
  # tip: remove http to make production-grade
  # - http
  - https
# format of bodies a client can send (Content-Type)
consumes:
  - application/json
# format of the responses to the client (Accepts)
produces:
  - application/json
  - application/xml
  - text/plain
  - text/tab-separated-values
paths:
  /gxa:
    x-swagger-router-controller: gxa
    get:
      summary: Redirect to EBI
      operationId: redirectToEbi
      responses:
        301:
          description: Redirecting

  /gxa/json/experiments/{experiment_id}:
    x-swagger-router-controller: gxa
    post:
      summary: "Fetch reference study expression profiles"
      description: "Accepts a list of gene ids and returns gxa response"
      operationId: one_baseline_experiment
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - name: experiment_id
          in: path
          required: true
          type: string
          description: "The unique ID of an experiment"
        - in: body
          name: geneQuery
          description: list of gene ids
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: Successful expression response

  /gxa/json/baseline_experiments:
    x-swagger-router-controller: gxa
    post:
      summary: "Fetch baseline expression profiles"
      description: "Accepts a list of gene ids and returns gxa response"
      operationId: baseline_experiments
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - in: body
          name: geneQuery
          description: list of gene ids
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: Successful expression response

  /docs:
    get:
      summary: "Web site describing this API"
      tags:
        - "API Documentation"
      responses:
        200:
          description: "HTML documentation for this web service, powered by swagger."
