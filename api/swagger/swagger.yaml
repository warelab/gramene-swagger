  # Primer design (docs/primer_design_api.md). These must stay before /{collection}.
  /primers/design:
    x-swagger-router-controller: primers
    post:
      summary: "Design PCR or qPCR primers"
      description: "Synchronous Primer3 2.6.1 design on a gene (with flanks), a spliced transcript (junction-spanning qPCR), a genomic region or a pasted sequence. Template coordinates are 1-based inclusive; intervals are [start, length]. Requires Content-Type: application/json. Every response is Cache-Control: no-store."
      operationId: designPrimers
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: "design request; mode-specific required fields are checked by the handler"
          required: true
          schema:
            $ref: "#/definitions/PrimerDesignRequest"
      responses:
        200:
          description: "Template, primer pairs (possibly none, with warning NO_PAIRS), Primer3 explain counts, effective settings and warnings"
          schema:
            $ref: "#/definitions/PrimerDesignResponse"
        400:
          description: "Swagger validation errors ({message: 'Validation errors', errors[]}, e.g. INVALID_CONTENT_TYPE) or INVALID_REQUEST, INVALID_PARAMS, INVALID_SEQUENCE, TEMPLATE_TOO_LONG, REGION_OUT_OF_BOUNDS, INTERVAL_OUT_OF_BOUNDS, SYSTEM_NAME_MISMATCH, PRIMER3_INPUT_ERROR"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_GENE, UNKNOWN_TRANSCRIPT, UNKNOWN_GENOME, UNKNOWN_REGION"
          schema:
            $ref: "#/definitions/PrimerError"
        413:
          description: "Request body larger than 100 kb"
        422:
          description: "NO_SEQUENCE, AMBIGUOUS_ASSEMBLY"
          schema:
            $ref: "#/definitions/PrimerError"
        500:
          description: "PRIMER3_FAILED, GENE_STRUCTURE_MISMATCH, INTERNAL"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "BUSY, PRIMER3_UNAVAILABLE, FEATURE_DISABLED, MONGO_UNAVAILABLE; details.retry_after_s and a Retry-After header"
          schema:
            $ref: "#/definitions/PrimerError"
        504:
          description: "DEADLINE_EXCEEDED (45 s in total, 30 s for Primer3)"
          schema:
            $ref: "#/definitions/PrimerError"

  /primers/genomes:
    x-swagger-router-controller: primers
    get:
      summary: "Genomes of the same species, with sequence, BLAST database and repeat-masking availability"
      description: "The query genome first, then the other genomes of its species (first taxonomy ancestor of rank species) by display name. No filesystem paths are returned."
      operationId: primerGenomes
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: query
          name: system_name
          description: "query genome, e.g. sorghum_bicolor"
          required: true
          type: string
          pattern: "^[a-z0-9_]+$"
          maxLength: 128
      responses:
        200:
          description: "species, counts and genomes"
          schema:
            $ref: "#/definitions/PrimerGenomesResponse"
        400:
          description: "Swagger validation errors (missing or malformed system_name)"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_GENOME"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "MONGO_UNAVAILABLE, FEATURE_DISABLED"
          schema:
            $ref: "#/definitions/PrimerError"

  /primers/check:
    x-swagger-router-controller: primers
    post:
      summary: "Submit a primer specificity / pan-genome check"
      description: "Queues a check job (BLAST against the reference genome, plus its transcriptome in transcript mode, and optionally every same-species genome). Job ids are deterministic: an identical request returns the existing job (200) instead of queueing a new one (202). Poll GET /primers/check/{job_id}."
      operationId: submitPrimerCheck
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: "check request (frozen contract)"
          required: true
          schema:
            $ref: "#/definitions/PrimerCheckRequest"
      responses:
        200:
          description: "An identical job already exists (queued, running or done)"
          schema:
            $ref: "#/definitions/PrimerCheckJob"
        202:
          description: "A new job was queued (also when an errored job is re-queued)"
          schema:
            $ref: "#/definitions/PrimerCheckJob"
        400:
          description: "Swagger validation errors, or INVALID_REQUEST, INVALID_PARAMS (params.max_amplifying_mismatches not below ignore_mismatches), DUPLICATE_PAIR_ID, TOO_MANY_PRIMERS, PRODUCT_TOO_LONG_TO_CHECK, GENOME_NOT_CHECKABLE, SYSTEM_NAME_MISMATCH"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_GENOME, UNKNOWN_GENE, UNKNOWN_TRANSCRIPT"
          schema:
            $ref: "#/definitions/PrimerError"
        422:
          description: "JOB_TOO_LARGE, NO_BLASTDB, AMBIGUOUS_ASSEMBLY"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "QUEUE_FULL, JOB_STORE_UNAVAILABLE, FEATURE_DISABLED, MONGO_UNAVAILABLE; details.retry_after_s and a Retry-After header"
          schema:
            $ref: "#/definitions/PrimerError"

  /primers/check/{job_id}:
    x-swagger-router-controller: primers
    get:
      summary: "Check job status and results"
      description: "status queued, running (partial results while the pan-genome stage runs), done or error. Jobs expire (done 24 h, error 1 h), after which the id returns 404 UNKNOWN_JOB."
      operationId: getPrimerCheck
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: job_id
          description: "32 lowercase hex characters"
          required: true
          type: string
          pattern: "^[0-9a-f]{32}$"
      responses:
        200:
          description: "Job status, progress and results (results null until there is something to show)"
          schema:
            $ref: "#/definitions/PrimerCheckJob"
        400:
          description: "Swagger validation errors (malformed job_id)"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_JOB (unknown or expired)"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "JOB_STORE_UNAVAILABLE, FEATURE_DISABLED"
          schema:
            $ref: "#/definitions/PrimerError"

  # Genotyping primers (docs/genotyping_design_spec.md §2.3-§2.6). Also before /{collection}.
  /primers/variants:
    x-swagger-router-controller: primers
    get:
      summary: "Known variants (Ensembl REST) in a genomic window, normalized to left-aligned VCF keys and verified against this site's genome"
      description: "One entry per designable biallelic key; Ensembl records describing the same event are merged. Only genomes with variation data (GET /primers/genomes has_variation) can be queried. Cache-Control: no-store."
      operationId: listPrimerVariants
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: query
          name: system_name
          description: "genome with variation data, e.g. sorghum_bicolor"
          required: true
          type: string
          pattern: "^[a-z0-9_]+$"
          maxLength: 128
        - in: query
          name: region
          description: "sequence name of the assembly, e.g. 1"
          required: true
          type: string
          maxLength: 255
        - in: query
          name: start
          description: "1-based window start"
          required: true
          type: integer
          minimum: 1
        - in: query
          name: end
          description: "1-based inclusive window end; end - start + 1 <= 50000"
          required: true
          type: integer
          minimum: 1
        - in: query
          name: types
          description: "comma-separated variant kinds; default all"
          required: false
          type: array
          collectionFormat: csv
          items:
            type: string
            enum: [snv, mnv, insertion, deletion, complex]
        - in: query
          name: include_ems
          description: "default true; false drops entries all of whose records are EMS"
          required: false
          type: boolean
        - in: query
          name: limit
          description: "default 2000; truncated is true when more matched"
          required: false
          type: integer
          minimum: 1
          maximum: 5000
      responses:
        200:
          description: "variants in the window"
          schema:
            $ref: "#/definitions/PrimerVariantList"
        400:
          description: "validator errors, VARIANT_WINDOW_TOO_LONG, REGION_OUT_OF_BOUNDS"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_GENOME, UNKNOWN_REGION"
          schema:
            $ref: "#/definitions/PrimerError"
        422:
          description: "NO_VARIATION_DATA, NO_SEQUENCE, AMBIGUOUS_ASSEMBLY"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "VARIATION_SOURCE_UNAVAILABLE, FEATURE_DISABLED, MONGO_UNAVAILABLE; details.retry_after_s and a Retry-After header"
          schema:
            $ref: "#/definitions/PrimerError"

  /primers/variants/{variant_id}:
    x-swagger-router-controller: primers
    get:
      summary: "Resolve one Ensembl variation id to normalized variant entries (one per designable alt)"
      description: "The id may contain ',' and '*' and must be URL-encoded. Every Ensembl id describing the same event is merged into the entry (warning DUPLICATE_VARIANT_IDS). Cache-Control: no-store."
      operationId: getPrimerVariant
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: path
          name: variant_id
          description: "Ensembl variation id, e.g. rs871475760 or tmp_1_11502_C_CGT"
          required: true
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:,*-]{0,254}$"
        - in: query
          name: system_name
          description: "genome with variation data, e.g. sorghum_bicolor"
          required: true
          type: string
          pattern: "^[a-z0-9_]+$"
          maxLength: 128
      responses:
        200:
          description: "the variant"
          schema:
            $ref: "#/definitions/PrimerVariantLookup"
        400:
          description: "validator errors"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_VARIANT, UNKNOWN_GENOME"
          schema:
            $ref: "#/definitions/PrimerError"
        422:
          description: "NO_VARIATION_DATA, NO_SEQUENCE, AMBIGUOUS_ASSEMBLY, AMBIGUOUS_VARIANT_MAPPING, VARIANT_NOT_ON_ASSEMBLY"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "VARIATION_SOURCE_UNAVAILABLE, FEATURE_DISABLED, MONGO_UNAVAILABLE; details.retry_after_s and a Retry-After header"
          schema:
            $ref: "#/definitions/PrimerError"

  /primers/genotyping/design:
    x-swagger-router-controller: primers
    post:
      summary: "Design KASP or allele-specific PCR primer sets for one variant"
      description: "Synchronous, 45 s deadline (Ensembl work runs before the design semaphore). Returns explicit sets (REF-specific, ALT-specific and common primers), order-sheet rows and a ready /primers/check request. Requires Content-Type: application/json. Every response is Cache-Control: no-store."
      operationId: designGenotypingPrimers
      tags:
        - "Primer design"
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: "genotyping design request; exactly one of variant {id [, alt]} or {region, position, ref, alt}"
          required: true
          schema:
            $ref: "#/definitions/PrimerGenotypingRequest"
      responses:
        200:
          description: "variant, template, per-orientation attempts, sets (possibly none, with warning NO_SETS), check request, warnings; a design stopped by its budget is still a 200 with DESIGN_BUDGET_EXHAUSTED"
          schema:
            $ref: "#/definitions/PrimerGenotypingResponse"
        400:
          description: "validator errors, INVALID_REQUEST, INVALID_PARAMS, INVALID_VARIANT, REF_MISMATCH, ALT_REQUIRED, ALT_NOT_AT_SITE, UNSUPPORTED_ALLELE, VARIANT_TOO_CLOSE_TO_END, VARIANT_TOO_REPETITIVE, REGION_OUT_OF_BOUNDS, PRIMER3_INPUT_ERROR"
          schema:
            $ref: "#/definitions/PrimerError"
        404:
          description: "UNKNOWN_GENOME, UNKNOWN_REGION, UNKNOWN_VARIANT"
          schema:
            $ref: "#/definitions/PrimerError"
        413:
          description: "Request body larger than 100 kb"
        422:
          description: "NO_SEQUENCE, AMBIGUOUS_ASSEMBLY, NO_VARIATION_DATA, AMBIGUOUS_VARIANT_MAPPING, VARIANT_NOT_ON_ASSEMBLY"
          schema:
            $ref: "#/definitions/PrimerError"
        500:
          description: "PRIMER3_FAILED, THERMO_FAILED, INTERNAL"
          schema:
            $ref: "#/definitions/PrimerError"
        503:
          description: "BUSY, PRIMER3_UNAVAILABLE, THERMO_UNAVAILABLE, VARIATION_SOURCE_UNAVAILABLE, FEATURE_DISABLED, MONGO_UNAVAILABLE; details.retry_after_s and a Retry-After header"
          schema:
            $ref: "#/definitions/PrimerError"
        504:
          description: "DEADLINE_EXCEEDED (45 s end to end)"
          schema:
            $ref: "#/definitions/PrimerError"

  /{collection}:
    x-swagger-router-controller: mongo
    get:
      summary: "MongoDB"
      operationId: get
      description: "Legacy method for backward-compatibility. No schema specified for response document."
      parameters:
        - $ref: "#/parameters/collection"
        - $ref: "#/parameters/q"
        - $ref: "#/parameters/rows"
        - $ref: "#/parameters/start"
        - $ref: "#/parameters/fl"
        - $ref: "#/parameters/wt"
        - $ref: "#/parameters/idList"
      tags:
        - "Data access"
      responses:
        200:
          description: "MongoDB response object"
